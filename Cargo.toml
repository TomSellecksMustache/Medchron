[package]
name = "medchron"
version = "2.6.0-rc.3"
edition = "2021"
description = "Local-first, source-linked medical chronology prototype"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart", "json"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
lopdf = "0.34"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
tower-http = { version = "0.5", features = ["limit", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
